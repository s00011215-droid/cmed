spring:
  application:
    name: xiangyun-gateway

  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: xiangyun-account
          uri: http://localhost:8081
          predicates: [Path=/api/v1/account/**]
        - id: xiangyun-consult
          uri: http://localhost:8082
          predicates: [Path=/api/v1/consult/**]
        - id: xiangyun-patient
          uri: http://localhost:8083
          predicates: [Path=/api/v1/patient/**]
        - id: xiangyun-emr
          uri: http://localhost:8084
          predicates: [Path=/api/v1/emr/**]
        - id: xiangyun-prescription
          uri: http://localhost:8085
          predicates: [Path=/api/v1/prescription/**]
        - id: xiangyun-his
          uri: http://localhost:8086
          predicates: [Path=/api/v1/his/**]
        - id: xiangyun-decoction
          uri: http://localhost:8087
          predicates: [Path=/api/v1/decoction/**]
        - id: xiangyun-logistics
          uri: http://localhost:8088
          predicates: [Path=/api/v1/logistics/**]
        - id: xiangyun-inventory
          uri: http://localhost:8089
          predicates: [Path=/api/v1/inventory/**]
        - id: xiangyun-finance
          uri: http://localhost:8090
          predicates: [Path=/api/v1/finance/**]
        - id: xiangyun-notify
          uri: http://localhost:8092
          predicates: [Path=/api/v1/notify/**]
        - id: xiangyun-risk
          uri: http://localhost:8093
          predicates: [Path=/api/v1/risk/**]
        - id: xiangyun-admin
          uri: http://localhost:8094
          predicates: [Path=/api/v1/admin/**]

  autoconfigure:
    exclude:
      - com.alibaba.cloud.nacos.NacosConfigAutoConfiguration
      - com.alibaba.cloud.nacos.discovery.NacosDiscoveryClientAutoConfiguration
      - com.alibaba.cloud.sentinel.SentinelWebAutoConfiguration
      - com.alibaba.cloud.sentinel.gateway.scg.SentinelSCGAutoConfiguration
      - com.alibaba.cloud.sentinel.endpoint.SentinelEndpointAutoConfiguration

server:
  port: 8080

jwt:
  secret: xiangyun-zhifang-jwt-secret-key-min-256-bits-change-in-production!!

logging:
  level:
    com.xiangyun.gateway: DEBUG
