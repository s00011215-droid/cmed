name: XiangYun ZhiFang CI/CD

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  backend:
    name: Backend — Validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: xiangyun_zhifang
          POSTGRES_USER: xiangyun_app
          POSTGRES_PASSWORD: xiangyun_test
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: 'maven' }
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Initialize Database
        run: psql -h localhost -U xiangyun_app -d xiangyun_zhifang -f infra/database/00-init-schema.sql
        env: { PGPASSWORD: xiangyun_test }

      - name: Maven Validate
        run: mvn -B -f backend/pom.xml validate

  frontend:
    name: Frontend — Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install Dependencies
        run: npm install
        working-directory: frontend

  docker:
    name: Docker — Build & Push
    if: github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, account, patient, doctor, emr, prescription, his, inventory, finance, decoction, logistics]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: '${{ env.REGISTRY }}', username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v5
        with:
          context: backend/xiangyun-${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/xiangyun-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/xiangyun-${{ matrix.service }}:${{ github.sha }}

  security:
    name: Security Scan
    if: github.ref == 'refs/heads/main'
    needs: [backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with: { scan-type: fs, scan-ref: backend/, format: sarif, output: trivy-results.sarif, severity: 'CRITICAL,HIGH' }
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy-results.sarif }
