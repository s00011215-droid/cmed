# ============================================================================
# 祥雲智方 — Prometheus 監控配置
# ============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: xiangyun-zhifang
    env: production

# AlertManager (警報路由)
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# 警報規則
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:

  # --- Kubernetes 服務發現 ---
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [xiangyun-zhifang]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__

  # --- PostgreSQL Exporter ---
  - job_name: postgresql
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: postgresql

  # --- Redis Exporter ---
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: redis

  # --- Nacos ---
  - job_name: nacos
    metrics_path: /nacos/actuator/prometheus
    static_configs:
      - targets: ['xiangyun-nacos:8848']
        labels:
          service: nacos

  # --- Spring Boot Actuator (所有微服務) ---
  - job_name: spring-boot
    metrics_path: /actuator/prometheus
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [xiangyun-zhifang]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: true

# ============================================================================
# 警報規則
# ============================================================================
groups:
  - name: xiangyun-critical
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} 服務停止"
          description: "服務 {{ $labels.job }} 已停止超過 2 分鐘"

      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} 錯誤率過高"
          description: "5xx 錯誤率 {{ $value | humanizePercentage }}"

      - alert: DatabaseConnectionPool
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "資料庫連接池使用率 > 80%"

      - alert: PostgresReplicationLag
        expr: pg_stat_replication_replay_lag_seconds > 30
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "PostgreSQL 複製延遲 > 30 秒"
